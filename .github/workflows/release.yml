name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "publish せず、配布物の内容だけ確認する"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify release
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/verify-release.mjs

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Full release check
        run: npm run check:full

      - name: Publish (dry run)
        if: github.ref_type != 'tag' || inputs.dry_run
        run: node scripts/publish-workspaces.mjs --dry-run

      - name: Publish
        if: github.ref_type == 'tag' && !inputs.dry_run
        run: node scripts/publish-workspaces.mjs
