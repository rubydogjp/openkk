name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Production dependency audit
        run: npm run audit:production

      - name: Generated source drift
        run: npm run check:generated

      - name: Package build, lint, and unit tests
        run: npm run check

  apps-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Production builds (original / Sim / demo)
        run: npm run build:apps

      - name: Export smoke (original)
        run: npm run test:e2e:export:built

      - name: Sim interaction E2E
        run: npm run test:e2e
